version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cctv_new_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cctv_new_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - AI_DEVICE=auto
    volumes:
      - ./backend/media:/app/media
      - ./backend/storage:/app/storage
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:

